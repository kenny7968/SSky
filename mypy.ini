[mypy]
# Gradual type checking configuration

# Basic configuration
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
disallow_untyped_calls = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True

# Gradual activation
strict_optional = True
# strict = False  # Enable in the future

# External libraries
ignore_missing_imports = True

# Module-specific settings (gradual strictification)

# Fully type-annotated modules
[mypy-core.protocols]
strict = True

[mypy-utils.crypto]
disallow_untyped_defs = True
disallow_incomplete_defs = True
# Allow unreachable code for runtime safety
warn_unreachable = False

[mypy-utils.file_utils]
strict = True

[mypy-utils.time_format]
strict = True

[mypy-utils.url_utils]
strict = True

[mypy-utils.auth_decorators]
strict = True

# Core modules (high priority)
[mypy-core.client.facade]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-core.client.auth_manager]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-core.data_store]
disallow_untyped_defs = True

# GUI related (gradual strictification)
[mypy-gui.handlers.auth_service]
check_untyped_defs = True

[mypy-gui.timeline.timeline_view]
check_untyped_defs = True

[mypy-gui.app]
check_untyped_defs = True

# Exclusions (temporary)
[mypy-config.*]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True

[mypy-gui.*]
ignore_errors = True

[mypy-SSky]
ignore_errors = True

# External libraries without stubs
[mypy-win32crypt]
ignore_missing_imports = True

[mypy-atproto]
ignore_missing_imports = True

[mypy-atproto_client]
ignore_missing_imports = True

[mypy-pubsub]
ignore_missing_imports = True

[mypy-wx]
ignore_missing_imports = True

[mypy-pywin32]
ignore_missing_imports = True