name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'
  PYTEST_ARGS: '-v --tb=short --strict-markers'

jobs:
  # Stage 1: Fast unit tests
  unit-tests:
    name: Unit Tests
    runs-on: windows-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock pytest-timeout pytest-xdist
    
    - name: Run Core Unit Tests
      run: |
        pytest tests/unit/core -m "not gui and not slow" --cov=core --cov-report=xml --cov-report=term-missing ${{ env.PYTEST_ARGS }}
      continue-on-error: true
    
    - name: Run Utils Unit Tests
      run: |
        pytest tests/unit/utils -m "not gui" --cov=utils --cov-append --cov-report=xml --cov-report=term-missing ${{ env.PYTEST_ARGS }}
      continue-on-error: true
    
    - name: Run Config Unit Tests
      run: |
        pytest tests/unit/config -m "not gui" --cov=config --cov-append --cov-report=xml --cov-report=term-missing ${{ env.PYTEST_ARGS }}
      continue-on-error: true
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-unit
        path: coverage.xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: unit-coverage
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  # Stage 2: Integration tests (runs after unit tests)
  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: windows-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-timeout
    
    - name: Run Integration Tests
      run: |
        pytest tests/integration -m "not gui and not e2e" --maxfail=5 --timeout=60 ${{ env.PYTEST_ARGS }}
      continue-on-error: false

  # Stage 3: Contract tests
  contract-tests:
    name: Contract Tests
    runs-on: windows-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-mock
    
    - name: Run Contract Tests
      run: |
        pytest tests/contracts ${{ env.PYTEST_ARGS }}
      continue-on-error: true

  # Stage 4: Static analysis
  static-analysis:
    name: Static Analysis
    runs-on: windows-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install analysis tools
      run: |
        pip install flake8 mypy black isort bandit
    
    - name: Run flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true
    
    - name: Run black check
      run: |
        black --check . --exclude="/(\.git|\.venv|venv|build|dist|\.pytest_cache)/"
      continue-on-error: true
    
    - name: Run isort check
      run: |
        isort --check-only . --skip-glob="**/venv/**" --skip-glob="**/.venv/**"
      continue-on-error: true
    
    - name: Run security check with bandit
      run: |
        bandit -r core/ -f json -o bandit-report.json
      continue-on-error: true
    
    - name: Upload bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json

  # Test summary job
  test-summary:
    name: Test Summary
    needs: [unit-tests, integration-tests, contract-tests]
    runs-on: windows-latest
    if: always()
    
    steps:
    - name: Summary
      run: |
        echo "## Test Suite Summary"
        echo ""
        echo "### Job Results:"
        echo "- Unit Tests: ${{ needs.unit-tests.result }}"
        echo "- Integration Tests: ${{ needs.integration-tests.result }}"
        echo "- Contract Tests: ${{ needs.contract-tests.result }}"
        echo ""
        if [[ "${{ needs.unit-tests.result }}" == "success" ]]; then
          echo "✅ Core tests passed successfully!"
        else
          echo "⚠️ Some tests need attention"
        fi
      shell: bash

  # Optional: Nightly full test suite
  full-test-suite:
    name: Full Test Suite (Nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install all dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-html pytest-xdist
    
    - name: Run all tests with coverage
      run: |
        pytest tests/ -m "not gui" --cov=. --cov-report=html --html=report.html --self-contained-html
      continue-on-error: true
    
    - name: Upload test report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: full-test-report
        path: |
          report.html
          htmlcov/