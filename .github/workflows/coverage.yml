name: Coverage Report

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock faker factory-boy

    - name: Verify environment
      run: |
        echo "Python version:" 
        python --version
        echo "Working directory:"
        pwd
        echo "Test imports:"
        python -c "import sys; sys.path.insert(0, '.'); print('Testing imports...')"
        python -m pytest --version

    - name: Run tests with coverage
      working-directory: ${{ github.workspace }}
      run: |
        python -m pytest tests/unit -m "not gui" --cov=core --cov=utils --cov=config --cov-report=html --cov-report=xml --cov-report=term-missing --cov-report=json -v --tb=short
      env:
        PYTEST_RUNNING: '1'
        PYTHONPATH: ${{ github.workspace }}

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: comprehensive
        name: codecov-comprehensive
        fail_ci_if_error: false

    - name: Upload HTML coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html-report
        path: htmlcov/

    - name: Upload JSON coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-json-report
        path: coverage.json

    - name: Coverage Summary
      run: |
        python -c "
        import json
        import sys
        
        try:
            with open('coverage.json', 'r') as f:
                data = json.load(f)
            
            total_coverage = data['totals']['percent_covered']
            print(f'📊 Total Coverage: {total_coverage:.1f}%')
            
            # Phase 2 target coverage
            target_coverage = 75.0
            
            if total_coverage >= target_coverage:
                print(f'✅ Coverage target achieved: {total_coverage:.1f}% >= {target_coverage}%')
            else:
                print(f'⚠️ Coverage below target: {total_coverage:.1f}% < {target_coverage}%')
            
            # File-by-file coverage report
            print('\n📁 File Coverage Summary:')
            files = data['files']
            for file_path, file_data in sorted(files.items()):
                coverage = file_data['summary']['percent_covered']
                print(f'  {file_path}: {coverage:.1f}%')
                
        except Exception as e:
            print(f'Error reading coverage data: {e}')
            sys.exit(1)
        "

    - name: Coverage Badge
      run: |
        python -c "
        import json
        
        try:
            with open('coverage.json', 'r') as f:
                data = json.load(f)
            
            coverage = data['totals']['percent_covered']
            
            # Coverage badge color
            if coverage >= 90:
                color = 'brightgreen'
            elif coverage >= 75:
                color = 'green'
            elif coverage >= 60:
                color = 'yellow'
            elif coverage >= 40:
                color = 'orange'
            else:
                color = 'red'
            
            badge_url = f'https://img.shields.io/badge/coverage-{coverage:.1f}%25-{color}'
            print(f'Coverage Badge URL: {badge_url}')
            
            # Write badge info to file
            with open('coverage_badge.txt', 'w') as f:
                f.write(f'{coverage:.1f}%\\n{color}\\n{badge_url}\\n')
                
        except Exception as e:
            print(f'Error generating badge: {e}')
        "

    - name: Upload coverage badge info
      uses: actions/upload-artifact@v4
      with:
        name: coverage-badge
        path: coverage_badge.txt

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          
          try {
            const coverageData = JSON.parse(fs.readFileSync('coverage.json', 'utf8'));
            const totalCoverage = coverageData.totals.percent_covered;
            
            const comment = `## 📊 Coverage Report
            
            **Total Coverage: ${totalCoverage.toFixed(1)}%**
            
            | File | Coverage |
            |------|----------|
            ${Object.entries(coverageData.files)
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([file, data]) => `| \`${file}\` | ${data.summary.percent_covered.toFixed(1)}% |`)
              .join('\n')}
            
            ${totalCoverage >= 75 ? '✅' : '⚠️'} Coverage ${totalCoverage >= 75 ? 'meets' : 'below'} target (75%)
            
            ---
            Generated by SSky Test Suite`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.error('Error posting coverage comment:', error);
          }