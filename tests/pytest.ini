[tool:pytest]
minversion = 7.0
addopts = 
    -ra
    --strict-markers
    --strict-config
    --ignore=tests/old
    --ignore=tests/run_tests.py
    --cov=core
    --cov=gui
    --cov=utils
    --cov=config
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80
    --tb=short
    --verbose
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git .tox dist build *.egg

markers =
    unit: 単体テスト
    integration: 統合テスト
    e2e: エンドツーエンドテスト
    slow: 実行時間の長いテスト（通常はスキップ）
    performance: パフォーマンステスト
    contract: API契約テスト
    contract_schema: API契約スキーマテスト
    contract_api: API契約動作テスト
    contract_data: API契約データテスト
    contract_interface: 内部インターフェース契約テスト
    gui: GUIコンポーネントテスト
    windows: Windows専用テスト
    network: ネットワーク接続が必要なテスト
    database: データベースアクセスが必要なテスト

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning